<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Liquidity Collider — BTC-USD</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bid: #58d0ff;
    --ask: #ff9a52;
    --ink: #e8eef7;
    --dim: rgba(190, 205, 225, 0.55);
    --faint: rgba(190, 205, 225, 0.28);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020308; color: var(--ink);
    font-family: var(--mono); -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  .hud { position: fixed; z-index: 5; pointer-events: none; font-size: 10.5px; line-height: 1.75;
    letter-spacing: 0.14em; text-transform: uppercase; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 1px 2px rgba(0, 0, 0, 0.9); transition: opacity 0.4s; }
  body.nohud .hud, body.nohud #labels { opacity: 0; }
  body.nohud [data-tip], body.nohud #what, body.nohud #pal, body.nohud #mat { pointer-events: none; }
  .k { color: var(--dim); }
  .hud b { font-weight: 500; color: var(--ink); }
  .tl { top: 26px; left: 30px; }
  .tr { top: 26px; right: 30px; text-align: right; }
  .bc { bottom: 26px; left: 50%; transform: translateX(-50%); text-align: center; }
  .bl { bottom: 26px; left: 30px; color: var(--bid); }
  .br { bottom: 26px; right: 30px; color: var(--ask); text-align: right; }
  .title { color: var(--ink); letter-spacing: 0.32em; font-size: 10px; }
  .pair { color: var(--dim); }
  .mid { font-size: 38px; font-weight: 300; letter-spacing: 0.02em; line-height: 1.25; margin: 6px 0 2px; color: #fff; }
  .mid small { font-size: 19px; color: var(--dim); }
  .row { display: flex; gap: 14px; justify-content: space-between; }
  .tr .row { justify-content: flex-end; }
  .tr .row .k { min-width: 92px; }
  .tr .row b { min-width: 96px; }
  .status { display: flex; gap: 9px; align-items: center; justify-content: flex-end; color: var(--ink); letter-spacing: 0.24em; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: #facc15; box-shadow: 0 0 10px currentColor; color: #facc15; }
  #dot.live { background: #4ade80; color: #4ade80; }
  #dot.replay { background: #c084fc; color: #c084fc; }
  .note { color: var(--faint); font-size: 9.5px; }
  .imb { display: flex; gap: 14px; align-items: center; justify-content: center; font-size: 17px; letter-spacing: 0.06em; margin: 2px 0; }
  .imb .bid { color: var(--bid); } .imb .ask { color: var(--ask); }
  #bar { position: relative; width: 220px; height: 2px; background: var(--ask); opacity: 0.9; }
  #barfill { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: var(--bid); transition: width 0.25s linear; }
  #bar::after { content: ""; position: absolute; left: 50%; top: -4px; width: 1px; height: 10px; background: rgba(255,255,255,0.5); }
  .axis { position: fixed; z-index: 5; left: 30px; pointer-events: none; font-size: 9px; letter-spacing: 0.2em;
    color: var(--faint); text-transform: uppercase; transition: opacity 0.4s; }
  body.nohud .axis { opacity: 0; }
  body::after { content: ""; position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: linear-gradient(180deg, rgba(2,3,8,0.72) 0, rgba(2,3,8,0) 24%, rgba(2,3,8,0) 80%, rgba(2,3,8,0.72) 100%); }
  #labels { position: fixed; inset: 0; z-index: 4; pointer-events: none; transition: opacity 0.4s; }
  .whale { position: absolute; transform: translate(-50%, -50%); font-size: 12px; letter-spacing: 0.16em; white-space: nowrap;
    text-shadow: 0 0 14px currentColor, 0 0 3px #000; animation: rise 2.6s cubic-bezier(.2,.7,.2,1) forwards; }
  .whale small { display: block; font-size: 9px; opacity: 0.7; text-align: center; }
  @keyframes rise { 0% { opacity: 0; margin-top: 0; } 12% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; margin-top: -90px; } }
  body::after { transition: opacity 0.4s; }
  body.paper::after { background:
    radial-gradient(ellipse 48% 56% at 0% 0%, rgba(236,230,218,0.94) 30%, rgba(236,230,218,0) 100%),
    radial-gradient(ellipse 38% 36% at 100% 0%, rgba(236,230,218,0.94) 30%, rgba(236,230,218,0) 100%),
    linear-gradient(0deg, rgba(236,230,218,0.92) 0, rgba(236,230,218,0.6) 12%, rgba(236,230,218,0) 26%); }
  body.bright::after { background:
    radial-gradient(ellipse 48% 56% at 0% 0%, rgba(2,3,8,0.92) 30%, rgba(2,3,8,0) 100%),
    radial-gradient(ellipse 38% 36% at 100% 0%, rgba(2,3,8,0.92) 30%, rgba(2,3,8,0) 100%),
    linear-gradient(0deg, rgba(2,3,8,0.92) 0, rgba(2,3,8,0.6) 12%, rgba(2,3,8,0) 26%); }
  body.paper .hud, body.paper .axis, body.paper #labels { --ink: #171a21; --dim: rgba(30,34,46,0.68); --faint: rgba(30,34,46,0.45); }
  body.paper .hud { text-shadow: 0 0 10px rgba(238,232,220,0.95), 0 0 2px rgba(238,232,220,0.9); }
  body.paper .mid { color: var(--ink); }
  body.paper #what, body.paper #pal, body.paper #mat { background: rgba(20,24,32,0.05); border-color: rgba(20,24,32,0.38); }
  body.paper #what i, body.paper #mat i { color: #ece6d8; }
  body.paper #bar::after { background: rgba(20,24,32,0.6); }
  body.paper .whale { text-shadow: 0 0 8px rgba(238,232,220,0.95), 0 0 2px rgba(238,232,220,0.9); }
  [data-tip] { pointer-events: auto; cursor: help; }
  #what, #pal, #mat { pointer-events: auto; cursor: pointer; margin-top: 12px; display: inline-flex; gap: 8px; align-items: center;
    font: inherit; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.22); border-radius: 999px; padding: 4px 13px 4px 6px; transition: background .2s, border-color .2s; }
  #pal, #mat { display: flex; margin-top: 8px; }
  button#pal i { background: linear-gradient(90deg, var(--bid) 50%, var(--ask) 50%); }

  #what:hover, #pal:hover, #mat:hover { background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.5); }
  #what i, #pal i, #mat i { font-style: normal; width: 16px; height: 16px; line-height: 16px; text-align: center; border-radius: 50%;

    box-shadow: 0 12px 40px rgba(0,0,0,0.55);

  #tip.pin.on { pointer-events: auto; padding-right: 40px; }

    display: flex; gap: 8px; align-items: center; }
  #tip h4 i, #about li i { flex: none; width: 9px; height: 9px; border-radius: 2px; }
  #tip .kv { display: flex; justify-content: space-between; gap: 22px; font: 10.5px/1.7 var(--mono); letter-spacing: 0.06em;
    color: var(--dim); font-variant-numeric: tabular-nums; }
  #tip .kv b { color: #fff; font-weight: 500; }
  #tip .kv span, #tip .kv b { white-space: nowrap; }
  #tip p { margin-top: 7px; }
  #about { position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(2,3,8,0.55); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none; transition: opacity .3s; }

  #about .card { position: relative; width: min(760px, 100%); max-height: calc(100vh - 40px); overflow: auto; padding: 34px 38px 28px;
    background: rgba(8, 11, 22, 0.9); border: 1px solid rgba(255,255,255,0.13); border-radius: 12px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.7); font: 13.5px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; color: rgba(226,233,245,0.86);
    transform: translateY(10px); transition: transform .3s; }
  #about.on .card { transform: none; }
  #about .eyebrow { font: 10px var(--mono); letter-spacing: 0.32em; text-transform: uppercase; color: var(--dim); }
  #about h2 { font: 300 30px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; margin: 8px 0 12px; }
  #about .lead { font-size: 15px; color: rgba(236,241,250,0.95); }
  #about h3 { font: 500 10px var(--mono); letter-spacing: 0.24em; text-transform: uppercase; color: var(--dim); margin: 24px 0 10px; }
  #about ul { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 30px; }
  #about li { display: flex; gap: 11px; }
  #about li i { margin-top: 6px; }

  #about .keys { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  #about kbd { font: 10.5px var(--mono); color: #fff; border: 1px solid rgba(255,255,255,0.28); border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
  #about .foot { margin-top: 22px; font-size: 12px; color: var(--dim); }
  #about .top { position: absolute; top: 16px; right: 18px; display: flex; gap: 8px; }
  #about button { font: 10px var(--mono); letter-spacing: 0.16em; color: var(--ink); background: none; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.22); border-radius: 999px; padding: 4px 11px; }
  #about button:hover { background: rgba(255,255,255,0.12); }
  @media (max-width: 640px) { #about ul { grid-template-columns: 1fr; } #about .card { padding: 26px 22px 22px; } }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20;

    .hud { font-size: 9.5px; letter-spacing: 0.1em; }

    .tr .row .k { display: none; } .tr .row b { min-width: 0; }

    #tip { max-width: calc(100vw - 24px); }
  }
</style>

<body>
<canvas id="gl"></canvas>

<div class="hud tl">
  <div class="title" data-tip="title">Liquidity Collider</div>
  <div class="pair" data-tip="title">BTC–USD · Coinbase L2 · 64 tiers × 1 bp</div>
  <div class="mid" id="mid" data-tip="mid">—</div>
  <div class="row" data-tip="spread"><span class="k">Spread</span><b id="spr">—</b></div>
  <button id="what"><i>?</i><span id="whatlbl">What is this</span></button>
  <button id="pal" data-tip="palette"><i></i><span id="palname"></span></button>

</div>

<div class="hud tr">
  <div data-tip="feed">
    <div class="status"><i id="dot"></i><span id="feed">Connecting</span></div>
    <div class="note" id="feednote">&nbsp;</div>
  </div>
  <div class="row" data-tip="ping"><span class="k">Ping</span><b id="rtt">—</b></div>
  <div class="row" data-tip="tps"><span class="k">Throughput</span><b id="tps">—</b></div>
  <div class="row" data-tip="tape"><span class="k">Tape</span><b id="mom">—</b></div>
  <div class="row" data-tip="fps"><span class="k">Render</span><b id="fps">—</b></div>
</div>

<div class="hud bl" data-tip="bids">Bids ▸<div class="note" id="db">—</div></div>
<div class="hud br" data-tip="asks">◂ Asks<div class="note" id="da">—</div></div>

<div class="hud bc">
  <div data-tip="ratio">
    <div class="k">1% depth ratio</div>
    <div class="imb"><b id="ib" class="bid">—</b><span id="bar"><i id="barfill"></i></span><b id="ia" class="ask">—</b></div>
  </div>
  <div class="note hint" id="hint"></div>
</div>

<div class="axis" style="top:50%; transform:translateY(-50%)" data-tip="touch">— touch</div>
<div id="tip"></div>
<div id="about"><div class="card" id="aboutcard"></div></div>
<div id="labels"></div>
<div id="err"></div>

<script>
'use strict';

/* =====================================================================
   1. FEED ENGINE  (runs inside a Web Worker; falls back to main thread)
   Maintains the full L2 book, aggregates it into 64 one-basis-point
   tiers per side, batches trades, and posts a Float32Array ~30x/second.
   When the socket is unavailable it runs a seeded synthetic book.
   ===================================================================== */
function feedEngine(post, opts) {
  const N = 64, PRODUCT = 'BTC-USD', WS_URL = 'wss://ws-feed.exchange.coinbase.com';
  const bids = new Map(), asks = new Map();
  const now = () => performance.now();
  let live = false, connecting = false, forceReplay = !!opts.replay;
  let ws = null, reconnectTimer = 0;
  let lastMsgAt = 0, pingSentAt = 0, rtt = -1; const rttLog = [];
  let tickCount = 0, tps = 0, lastTpsAt = now();
  let agg = { buy: { usd: 0, size: 0 }, sell: { usd: 0, size: 0 } };
  let mom = 0, momSigned = 0, lastEmit = now();
  let synth = null;

  function onTrade(takerSide, price, size) {
    const a = agg[takerSide]; a.usd += price * size; a.size += size;
  }

  /* ---------- live socket ---------- */
  function connect() {
    if (forceReplay || ws) return;
    let sock;
    try { sock = new WebSocket(WS_URL); } catch (e) { scheduleReconnect(); return; }
    ws = sock; connecting = true;
    let gotSnap = false;
    const timer = setTimeout(() => { if (!gotSnap) { try { sock.close(); } catch (e) {} } }, 8000);
    sock.onopen = () => {
      sock.send(JSON.stringify({ type: 'subscribe', product_ids: [PRODUCT], channels: ['level2_batch', 'matches', 'heartbeat'] }));
      pingSentAt = now();
    };
    sock.onmessage = (ev) => {
      if (sock !== ws) return;
      lastMsgAt = now();
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      switch (m.type) {
        case 'snapshot':
          synth = null; bids.clear(); asks.clear();
          for (const r of m.bids) bids.set(+r[0], +r[1]);
          for (const r of m.asks) asks.set(+r[0], +r[1]);
          gotSnap = true; clearTimeout(timer); live = true; connecting = false;
          break;
        case 'l2update':
          if (!live) break;
          for (const ch of m.changes) {
            const book = ch[0] === 'buy' ? bids : asks, p = +ch[1], s = +ch[2];
            if (s === 0) book.delete(p); else book.set(p, s);
            tickCount++;
          }
          break;
        case 'match':
          // "side" is the maker side: a resting sell that got hit means the taker bought.
          if (live) { onTrade(m.side === 'sell' ? 'buy' : 'sell', +m.price, +m.size); tickCount++; }
          break;
        case 'subscriptions':
          if (pingSentAt) { rttLog.push(now() - pingSentAt); if (rttLog.length > 5) rttLog.shift(); rtt = Math.min.apply(null, rttLog); pingSentAt = 0; }
          break;
      }
    };
    const down = () => {
      clearTimeout(timer);
      if (sock !== ws) return;
      ws = null; connecting = false;
      startReplay(); scheduleReconnect();
    };
    sock.onclose = down; sock.onerror = down;
  }
  function scheduleReconnect() {
    if (reconnectTimer || forceReplay) return;
    reconnectTimer = setTimeout(() => { reconnectTimer = 0; connect(); }, 20000);
  }
  function dropSocket() {
    const s = ws; ws = null; connecting = false;
    if (s) { try { s.close(); } catch (e) {} }
  }
  function startReplay() {
    if (live || !synth) { bids.clear(); asks.clear(); synth = makeSynth(0xC01DBEEF); }
    live = false; rtt = -1; rttLog.length = 0;
  }

  /* ---------- deterministic synthetic book ---------- */
  function makeSynth(seed) {
    let s = seed >>> 0;
    const rnd = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) * 1.732;
    const R = 1150;                         // book half-width in USD (covers > 1% of mid)
    let trend = 0, heat = 0.2, nextWhale = 120, burst = 0, burstSide = 'buy', stepN = 0;
    const prof = (p, dist, mult) => {       // resting size (BTC) at an integer price level
      let v = (0.16 + 0.5 * Math.pow(Math.max(dist, 1) / 600, 0.8)) * Math.exp(0.7 * gauss()) * mult;
      if (p % 100 === 0) v *= 5 + 4 * rnd(); else if (p % 50 === 0) v *= 3; else if (p % 10 === 0) v *= 1.6;
      return v;
    };
    const ref = 104200;
    for (let p = ref - R; p <= ref + R; p++) {
      if (p < ref) bids.set(p, prof(p, ref - p, 1)); else if (p > ref) asks.set(p, prof(p, p - ref, 1));
    }
    function best() {
      let bb = -Infinity, ba = Infinity;
      for (const p of bids.keys()) if (p > bb) bb = p;
      for (const p of asks.keys()) if (p < ba) ba = p;
      return [bb, ba];
    }
    function market(side, size) {           // taker order walks the opposing book
      const book = side === 'buy' ? asks : bids, dir = side === 'buy' ? 1 : -1;
      const b = best(); let p = side === 'buy' ? b[1] : b[0];
      if (!isFinite(p)) return;
      let rem = size, usd = 0, filled = 0;
      for (let k = 0; k < 900 && rem > 1e-9; k++, p += dir) {
        const q = book.get(p); if (!q) continue;
        const t = Math.min(q, rem); rem -= t; filled += t; usd += t * p;
        if (q - t < 1e-9) book.delete(p); else book.set(p, q - t);
        tickCount++;
      }
      if (filled > 0) onTrade(side, usd / filled, filled);
    }
    function whale(side, size) {
      side = side || (rnd() < 0.5 + 0.4 * trend ? 'buy' : 'sell');
      size = size || 2 + 38 * Math.pow(rnd(), 2.2);
      market(side, size);
      heat = Math.min(1, heat + 0.5); trend += side === 'buy' ? 0.25 : -0.25;
      burst = 4 + ((rnd() * 8) | 0); burstSide = side;
    }
    function step() {
      stepN++;
      trend += -trend * 0.02 + 0.06 * gauss(); trend = Math.max(-1, Math.min(1, trend));
      heat = heat * 0.94 + 0.008;
      for (let i = 0; i < 8; i++) {         // clustered small market orders
        if (rnd() >= heat * 0.75) continue;
        const side = rnd() < 0.5 + 0.35 * trend ? 'buy' : 'sell';
        const size = Math.min(25, 0.004 * Math.pow(1 - rnd(), -1 / 1.25));
        market(side, size); heat = Math.min(1, heat + 0.004 + size * 0.01);
      }
      if (--nextWhale <= 0) { whale(); nextWhale = 120 + ((rnd() * 300) | 0); }
      if (burst > 0 && stepN % 2 === 0) { burst--; market(burstSide, 0.1 + 1.2 * rnd() * rnd()); }

      let b = best(); let bb = b[0], ba = b[1];
      const mb = 1 + 0.45 * trend, ma = 1 - 0.45 * trend;
      for (let i = 0; i < 40; i++) {        // limit order churn, concentrated near the touch
        const dist = 1 + ((-Math.log(1 - rnd()) * 140) | 0); if (dist > R) continue;
        const isBid = rnd() < 0.5, p = isBid ? bb - dist + 1 : ba + dist - 1, book = isBid ? bids : asks;
        if (rnd() < 0.12) book.delete(p); else book.set(p, prof(p, dist, isBid ? mb : ma));
        tickCount++;
      }
      b = best(); bb = b[0]; ba = b[1];
      const mid = (bb + ba) / 2, lo = Math.floor(mid - R), hi = Math.ceil(mid + R);
      for (let p = lo; p <= hi; p++) {      // refill holes; the spread heals inward from both edges
        if (p <= bb) { if (!bids.has(p) && rnd() < 0.04) { bids.set(p, prof(p, mid - p, mb)); tickCount++; } }
        else if (p >= ba) { if (!asks.has(p) && rnd() < 0.04) { asks.set(p, prof(p, p - mid, ma)); tickCount++; } }
      }
      for (let k = 1 + (((ba - bb) / 40) | 0); k > 0 && ba - bb > 1; k--) {
        if (rnd() < 0.6) { bb++; bids.set(bb, prof(bb, 1, mb)); tickCount++; }
        if (ba - bb > 1 && rnd() < 0.6) { ba--; asks.set(ba, prof(ba, 1, ma)); tickCount++; }
      }
      if (stepN % 50 === 0) {
        for (const p of bids.keys()) if (p < lo - 200) bids.delete(p);
        for (const p of asks.keys()) if (p > hi + 200) asks.delete(p);
      }
    }
    return { step, whale };
  }

  /* ---------- aggregation + emit ---------- */
  function emit() {
    const t = now(), dt = Math.max(0.001, (t - lastEmit) / 1000 * (opts.rate || 1)); lastEmit = t;
    if (!live && synth) synth.step();
    if (t - lastTpsAt >= 1000) { tps = tickCount * 1000 / (t - lastTpsAt); tickCount = 0; lastTpsAt = t; }

    let bb = -Infinity, ba = Infinity;
    for (const p of bids.keys()) if (p > bb) bb = p;
    for (const p of asks.keys()) if (p < ba) ba = p;
    if (!(bb > 0) || !(ba < Infinity)) return;
    const mid = (bb + ba) / 2, w = mid * 1e-4, lim = mid * 0.01;
    const out = new Float32Array(N * 2 + 16);
    let d1b = 0, d1a = 0;
    for (const e of bids) { const dp = mid - e[0]; if (dp > lim) continue; const u = e[0] * e[1]; d1b += u;
      const i = Math.max(0, (dp / w) | 0); if (i < N) out[i] += u; }
    for (const e of asks) { const dp = e[0] - mid; if (dp > lim) continue; const u = e[0] * e[1]; d1a += u;
      const i = Math.max(0, (dp / w) | 0); if (i < N) out[N + i] += u; }

    const trades = [];
    const fb = agg.buy.usd, fs = agg.sell.usd;
    if (fb > 0) trades.push({ side: 'buy', usd: fb, size: agg.buy.size });
    if (fs > 0) trades.push({ side: 'sell', usd: fs, size: agg.sell.size });
    agg = { buy: { usd: 0, size: 0 }, sell: { usd: 0, size: 0 } };
    const a = 1 - Math.exp(-dt / 1.5);
    mom += ((fb + fs) / dt - mom) * a; momSigned += ((fb - fs) / dt - momSigned) * a;

    const M = N * 2;
    out[M] = mid; out[M + 1] = Math.max(0, ba - bb); out[M + 2] = d1b; out[M + 3] = d1a;
    out[M + 4] = live ? 1 : 0; out[M + 5] = rtt; out[M + 6] = tps; out[M + 7] = mom; out[M + 8] = momSigned;
    out[M + 9] = connecting ? 1 : 0;
    post({ buf: out.buffer, trades }, [out.buffer]);
  }

  setInterval(emit, 33 / (opts.rate || 1));
  setInterval(() => {
    const t = now();
    if (live && t - lastMsgAt > 8000) { dropSocket(); startReplay(); scheduleReconnect(); return; }
    if (pingSentAt && t - pingSentAt > 10000) pingSentAt = 0;
    if (live && ws && ws.readyState === 1 && !pingSentAt) {
      // Re-subscribing to heartbeat is idempotent; the "subscriptions" ack gives a round-trip time.
      pingSentAt = t;
      try { ws.send(JSON.stringify({ type: 'subscribe', product_ids: [PRODUCT], channels: ['heartbeat'] })); } catch (e) { pingSentAt = 0; }
    }
  }, 4000);

  startReplay();          // the screen is never empty: replay runs until the live snapshot lands
  connect();

  return function onCommand(m) {
    if (m.cmd === 'whale') { if (!live && synth) synth.whale(m.side); }
    else if (m.cmd === 'toggle') {
      forceReplay = !forceReplay;
      if (forceReplay) { clearTimeout(reconnectTimer); reconnectTimer = 0; dropSocket(); startReplay(); }
      else connect();
    }
  };
}

/* =====================================================================
   2. MAIN-THREAD STATE
   ===================================================================== */
const N = 64;
const params = new URLSearchParams(location.search);
const rawB = new Float32Array(N), rawA = new Float32Array(N);
const smB = new Float32Array(N), smA = new Float32Array(N), smOff = new Float32Array(N);
const dataTexBuf = new Float32Array(N * 4);
const S = { mid: 0, spread: 0, d1b: 0, d1a: 0, live: false, connecting: false, rtt: -1, tps: 0, mom: 0, momSigned: 0,
            vref: 0, momRef: 0, gap: 0.012, turb: 0.2, energy: 0, got: false, fps: 60 };
const tradeQueue = [];

function onFeed(msg) {
  const f = new Float32Array(msg.buf), M = N * 2;
  rawB.set(f.subarray(0, N)); rawA.set(f.subarray(N, M));
  S.mid = f[M]; S.spread = f[M + 1]; S.d1b = f[M + 2]; S.d1a = f[M + 3];
  const wasLive = S.live;
  S.live = f[M + 4] > 0.5; S.rtt = f[M + 5]; S.tps = f[M + 6]; S.mom = f[M + 7]; S.momSigned = f[M + 8];
  S.connecting = f[M + 9] > 0.5;
  if (wasLive !== S.live) { S.vref = 0; tradeQueue.length = 0; }
  S.got = true;
  for (const t of msg.trades) tradeQueue.push(t);
}

const feedOpts = { replay: params.has('replay'), rate: +params.get('rate') || 1 };
let sendCmd;
try {
  const src = 'const h=(' + feedEngine.toString() + ')((m,t)=>postMessage(m,t),' +
              JSON.stringify(feedOpts) + ');onmessage=e=>h(e.data);';
  const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  w.onmessage = (e) => onFeed(e.data);
  w.onerror = () => {};
  sendCmd = (m) => w.postMessage(m);
} catch (e) {
  sendCmd = feedEngine((m) => onFeed(m), feedOpts);
}

precision highp float; precision highp sampler2D;

// Shared by the force, dye and composite passes: tier lookup and front geometry.
const COMMON = `
uniform sampler2D uData; uniform float uGap; uniform float uAspect; uniform float uTime;
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);

// Vertical centre = touch (tier 0). Distance from centre = basis points from mid, 64 tiers each way.
float tierT(float y){ return abs(y-0.5)*2.0; }
// r = bid liquidity, g = ask liquidity (0..1), b = front offset from cumulative imbalance.
vec4 tierData(float y){ return texture(uData, vec2(tierT(y)*(63.0/64.0)+0.5/64.0, 0.5)); }

vec2 fronts(vec2 uv, vec4 d){

// Shared by every material's scene shader: palette ramps, shock lensing, backdrop.

uniform sampler2D uDye; uniform vec2 uTexel; uniform vec4 uShock[6];
uniform vec3 uBid[4]; uniform vec3 uAsk[4];
vec3 ramp(vec3 a, vec3 b, vec3 c, vec3 e, float d){ vec3 x = mix(a,b,smoothstep(0.0,0.45,d));
  x = mix(x,c,smoothstep(0.3,0.75,d)); return mix(x,e,smoothstep(0.75,1.5,d)); }
vec3 bidRamp(float d){ return ramp(uBid[0],uBid[1],uBid[2],uBid[3],d); }
vec3 askRamp(float d){ return ramp(uAsk[0],uAsk[1],uAsk[2],uAsk[3],d); }
vec3 heatCol(float h){ return (vec3(1.0,0.55,0.18) + vec3(0.6,0.9,1.0)*h*h)*h*h; }
float H(vec4 c){ return c.r+c.g+0.6*c.b; }
float shockWarp(inout vec2 uv){ float ring = 0.0;
  for(int i=0;i<6;i++){ vec4 s = uShock[i]; if(s.w<=0.001) continue;
    vec2 p = vec2((uv.x-s.x)*uAspect, uv.y-s.y); float dist = length(p); float w = 0.004+0.025*s.z;

float tickAt(float y){ float t = tierT(y)*64.0; return 1.0-smoothstep(0.0,0.07,abs(fract(t/8.0+0.5)-0.5)*8.0); }
vec3 backdrop(float y){ return vec3(0.006,0.009,0.018) + vec3(0.02,0.03,0.05)*tickAt(y)*0.5; }
`;

const FS = {

  dye: HEAD + COMMON + `uniform sampler2D uDye; uniform float uDt, uBoost, uRelax, uPuff, uFine, uEdge, uBands, uCoh; uniform vec2 uDyeTexel;

  sA = mix(sA, 0.10+9.0*pow(fbm(vec2(vUv.y*85.0+57.0, uTime*0.12+9.0)),3.0), uFine);

  sB *= mix(1.0, 0.3+1.8*smoothstep(0.32,0.70,noise(vec2(vUv.y*6.0, uTime*0.8))), uPuff);
  sA *= mix(1.0, 0.3+1.8*smoothstep(0.32,0.70,noise(vec2(vUv.y*6.0+31.0, uTime*0.8+5.0))), uPuff);

vec3 shade(vec4 c){ return bidRamp(c.r)*(1.0-exp(-1.8*c.r))*0.95 + askRamp(c.g)*(1.0-exp(-1.8*c.g))*0.95 + heatCol(c.b)*1.2; }

  composite_smoke: HEAD + COMMON + SCENE + `

  if (t.usd < 1500) return;
  const whale = t.usd >= 1e5;                     // $100k+ in one sweep
  const R = clamp(0.034 * Math.pow(t.usd / 1e5, 0.36), 0.008, 0.2) * clamp(aspect / 1.4, 0.5, 1);
  const hitAsks = t.side === 'buy';               // taker buy consumes ask liquidity
  const dir = hitAsks ? 1 : -1;
  const frontX = 0.5 + smOff[0] + dir * S.gap * 0.5;
  const py = 0.5 + (Math.random() - 0.5) * (whale ? 0.02 : 0.07);
  const px = frontX + dir * R * 0.55 / aspect;

    if (shocks.length >= 6) shocks.shift();

function placeTip(x, y, anchor) {
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight, m = 12;
  if (anchor) {                                    // next to an element: below it in the top half, above it otherwise
    x = anchor.right > innerWidth * 0.6 ? anchor.right - w : anchor.left;
    y = anchor.top < innerHeight * 0.5 ? anchor.bottom + 10 : anchor.top - h - 10;
  } else {                                         // next to the pointer, flipped near the edges
    x = x + 20 + w > innerWidth - m ? x - 20 - w : x + 20;
    y = y + 20 + h > innerHeight - m ? y - 14 - h : y + 20;
  }
  tipEl.style.transform = 'translate(' + Math.round(clamp(x, m, innerWidth - w - m)) + 'px,' + Math.round(clamp(y, m, innerHeight - h - m)) + 'px)';

let palIdx = 0;

    en: 'Thicker than water, thinner than honey. Small eddies die out, so it moves in broad, smooth bands that bend into large slow swirls. Drawn as a dark, glossy layer with wide soft highlights, and a rainbow sheen where the layer is thin, the way an oil film looks on water. Liquidity still sets how much there is on each row and how hard it pushes.',
    hu: 'A víznél sűrűbb, a méznél hígabb. A kis örvények elhalnak, ezért széles, sima sávokban mozog, amelyek nagy, lassú örvényekbe hajlanak. Sötét, fényes rétegként jelenik meg, széles, lágy csillogással, és ahol a réteg vékony, szivárványos fénye van, mint az olajfoltnak a vízen. Azt, hogy egy sorban mennyi van belőle és milyen erővel nyomul, továbbra is a likviditás adja.' },

    hu: 'Folyékony fém. Éles széle és tükröző felülete van: ahol elég van belőle, összefüggő lemezt alkot, ahol kevés, ott különálló gyöngyökre szakad. A paletta csak a tükröződést színezi, ezért itt a mennyiséget az mutatja, hogy a fém egy sorból mennyit fed le, nem a fényesség. Higanynak látszik, de nem húzódik magától kerek cseppekbe, ahogy a valódi higany.' }

let matIdx = 0;
try { matIdx = +localStorage.getItem('lc-mat') || 0; } catch (e) {}
if (params.get('mat')) matIdx = Math.max(0, MATERIALS.findIndex((m) => m.id === params.get('mat')));
function setMaterial(i) {
  matIdx = ((i % MATERIALS.length) + MATERIALS.length) % MATERIALS.length;
  MAT = MATERIALS[matIdx];
  document.getElementById('matname').textContent = MAT.name[lang];
  applyTheme();
  try { localStorage.setItem('lc-mat', matIdx); } catch (e) {}
}
setMaterial(matIdx);
document.getElementById('mat').onclick = () => { setMaterial(matIdx + 1); hideTip(); };

/* pointer stirring */
let ptr = null;
canvas.addEventListener('pointermove', (e) => {
  const x = e.clientX / innerWidth, y = 1 - e.clientY / innerHeight;
  if (ptr) { ptr.dx += x - ptr.x; ptr.dy += y - ptr.y; ptr.x = x; ptr.y = y; ptr.down = e.buttons > 0 || e.pointerType === 'touch'; }
  else ptr = { x, y, dx: 0, dy: 0, down: false };
  hover = e.buttons > 0 || e.pointerType === 'touch' || !CAN_HOVER ? null : { x: e.clientX, y: e.clientY, t: performance.now() };
  if (tipMode === 'fluid' && (!hover || !tipAt || Math.hypot(hover.x - tipAt.x, hover.y - tipAt.y) > 8)) hideTip();
});
let tapStart = null;
canvas.addEventListener('pointerdown', (e) => { const wasOpen = tipMode !== null; hideTip(); tapStart = { x: e.clientX, y: e.clientY, t: performance.now(), closed: wasOpen }; });
canvas.addEventListener('pointerup', (e) => {       // a short tap pins the inspector at that point
  if (tapStart && !tapStart.closed && performance.now() - tapStart.t < 800 && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) < 10) {
    hover = { x: e.clientX, y: e.clientY, t: -1e9, pinned: true }; tipAt = null; inspect();
  }
  tapStart = null;
});
canvas.addEventListener('pointercancel', () => { ptr = null; tapStart = null; });
canvas.addEventListener('pointerleave', (e) => { ptr = null; if (hover && hover.pinned && e.pointerType === 'touch') return; hover = null; inspect(); });
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === '?' || k === '/') toggleAbout();
  else if (k === 'escape') toggleAbout(false);
  else if (k === 'p') setPalette(palIdx + (e.shiftKey ? -1 : 1));
  else if (k === 'f') setMaterial(matIdx + (e.shiftKey ? -1 : 1));
  else if (k === 'i') { inspector = !inspector; inspect(); }
  else if (k === 'h') { document.body.classList.toggle('nohud'); hideTip(); }
  else if (k === 'w') sendCmd({ cmd: 'whale' });
  else if (k === 'm') sendCmd({ cmd: 'toggle' });
});

/* =====================================================================
   5. FRAME
   ===================================================================== */
function updateData(dt) {
  let mean = 0;
  for (let i = 0; i < N; i++) mean += rawB[i] + rawA[i];
  mean /= 2 * N;
  if (mean > 0) S.vref = S.vref > 0 ? S.vref + (mean - S.vref) * (1 - Math.exp(-dt * 0.5)) : mean;
  const ref = S.vref * 1.1 + 1e-9, k = 1 - Math.exp(-dt * 9), ks = 1 - Math.exp(-dt * 2.5);
  let cb = 0, ca = 0;
  for (let i = 0; i < N; i++) {
    smB[i] += (rawB[i] / (rawB[i] + ref) - smB[i]) * k;
    smA[i] += (rawA[i] / (rawA[i] + ref) - smA[i]) * k;
    cb += rawB[i]; ca += rawA[i];
    // The heavier side pushes the front toward the lighter one (cumulative imbalance down to this tier).
    smOff[i] += (0.11 * (cb - ca) / (cb + ca + 1e-9) - smOff[i]) * ks;
    dataTexBuf[i * 4] = smB[i]; dataTexBuf[i * 4 + 1] = smA[i]; dataTexBuf[i * 4 + 2] = smOff[i];
  }
  gl.bindTexture(gl.TEXTURE_2D, dataTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, N, 1, gl.RGBA, gl.FLOAT, dataTexBuf);

  // Spread -> gap width. Log scale: BTC-USD usually quotes ~0.001 bp wide, sweeps open it to several bp.
  const bps = S.mid > 0 ? S.spread / S.mid * 1e4 : 0;
  const gapT = clamp(0.007 + 0.036 * Math.log10(1 + 10 * bps), 0.007, 0.16);
  S.gap += (gapT - S.gap) * (1 - Math.exp(-dt * 8));

  S.momRef = S.momRef > 0 ? S.momRef + (S.mom - S.momRef) * (1 - Math.exp(-dt * 0.05)) : S.mom;
  const mn = S.mom / (S.mom + S.momRef + 1);
  S.turb += ((14 + 70 * mn) - S.turb) * (1 - Math.exp(-dt * 2));
  S.energy *= Math.exp(-dt * 1.4);
}

function simulate(dt) {
  gl.disable(gl.BLEND);
  tradeQueue.sort((a, b) => b.usd - a.usd);
  for (let i = 0; i < tradeQueue.length && i < 6; i++) applyTrade(tradeQueue[i]);
  tradeQueue.length = 0;

  for (let i = shocks.length - 1; i >= 0; i--) {
    const s = shocks[i]; s.r += s.speed * dt; s.i *= Math.exp(-dt * 2.4);
    if (s.i < 0.02) shocks.splice(i, 1);
  }
  shockBuf.fill(0);
  shocks.forEach((s, i) => { shockBuf[i * 4] = s.x; shockBuf[i * 4 + 1] = s.y; shockBuf[i * 4 + 2] = s.r; shockBuf[i * 4 + 3] = s.i; });

  if (ptr && (ptr.dx || ptr.dy)) {
    const g = ptr.down ? 14 : 4;
    use(P.splat); tex('uTex', vel.read, 0); f2('uPoint', ptr.x, ptr.y); f1('uRadius', 0.05); f1('uAspect', aspect);
    gl.uniform3f(cur.u.uColor, clamp(ptr.dx * vel.w * g * 10, -900, 900), clamp(ptr.dy * vel.h * g * 10, -900, 900), 0);
    draw(vel.write); vel.swap(); ptr.dx = ptr.dy = 0;
  }

  use(P.force); setCommon(); tex('uVel', vel.read, 0); f1('uDt', dt); f1('uForce', MAT.force); f1('uTurb', S.turb * MAT.turb);
  f1('uVisc', MAT.visc); f1('uShear', MAT.shear); f2('uTexel', vel.texel[0], vel.texel[1]);
  gl.uniform4fv(cur.u.uShock, shockBuf); draw(vel.write); vel.swap();

  use(P.curl); tex('uVel', vel.read, 0); f2('uTexel', vel.texel[0], vel.texel[1]); draw(curlT);
  use(P.vorticity); tex('uVel', vel.read, 0); tex('uCurl', curlT, 1); f2('uTexel', vel.texel[0], vel.texel[1]);
  f1('uDt', dt); f1('uCurlK', MAT.curl); draw(vel.write); vel.swap();

  use(P.divergence); tex('uVel', vel.read, 0); f2('uTexel', vel.texel[0], vel.texel[1]); draw(divT);
  use(P.copy); tex('uTex', pres.read, 0); f1('uValue', 0.8); draw(pres.write); pres.swap();
  use(P.pressure); f2('uTexel', vel.texel[0], vel.texel[1]); tex('uDiv', divT, 1);
  for (let i = 0; i < 18; i++) { tex('uP', pres.read, 0); draw(pres.write); pres.swap(); }
  use(P.gradient); tex('uP', pres.read, 0); tex('uVel', vel.read, 1); f2('uTexel', vel.texel[0], vel.texel[1]);
  draw(vel.write); vel.swap();

  use(P.advect); f2('uTexel', vel.texel[0], vel.texel[1]); f1('uDt', dt);
  tex('uVelocity', vel.read, 0); tex('uSource', vel.read, 0); f1('uDissipation', MAT.velDiss); draw(vel.write); vel.swap();
  tex('uVelocity', vel.read, 0); tex('uSource', dye.read, 1); f1('uDissipation', MAT.dyeDiss); draw(dye.write); dye.swap();

  use(P.dye); setCommon(); tex('uDye', dye.read, 0); f1('uDt', dt); f1('uBoost', bootT < 2 ? 3 : 0); f1('uRelax', MAT.relax); f1('uPuff', MAT.puff); f1('uFine', MAT.fine); f1('uEdge', MAT.edge); f1('uBands', MAT.bands); f1('uCoh', MAT.coh || 0); f2('uDyeTexel', dye.texel[0], dye.texel[1]);
  draw(dye.write); dye.swap();
}

function render() {
  use(P[MAT.prog]); setCommon(); tex('uDye', dye.read, 0); f2('uTexel', dye.texel[0], dye.texel[1]);
  gl.uniform4fv(cur.u.uShock, shockBuf);
  gl.uniform3fv(cur.u.uBid, PAL.bid); gl.uniform3fv(cur.u.uAsk, PAL.ask); draw(scene);

  if (bloom.length) {
    use(P.prefilter); tex('uTex', scene, 0); f1('uThreshold', MAT.bloomThr); draw(bloom[0]);
    use(P.blur);
    for (let i = 1; i < bloom.length; i++) { tex('uTex', bloom[i - 1], 0); f2('uTexel', bloom[i - 1].texel[0], bloom[i - 1].texel[1]); draw(bloom[i]); }
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    for (let i = bloom.length - 1; i > 0; i--) { tex('uTex', bloom[i], 0); f2('uTexel', bloom[i].texel[0], bloom[i].texel[1]); draw(bloom[i - 1]); }
    gl.disable(gl.BLEND);
  }
  use(P.final); tex('uScene', scene, 0); tex('uBloom', bloom[0] || scene, 1);
  f1('uTime', simTime); f1('uCA', 0.012 * S.energy); f1('uBloomI', bloom.length ? MAT.bloom + MAT.bloomE * S.energy : 0); f1('uVig', MAT.vig);
  draw(null);
}

/* ---------- telemetry ---------- */
const $ = (id) => document.getElementById(id);
const el = { mid: $('mid'), spr: $('spr'), dot: $('dot'), feed: $('feed'), note: $('feednote'), rtt: $('rtt'), tps: $('tps'),
             mom: $('mom'), fps: $('fps'), ib: $('ib'), ia: $('ia'), bar: $('barfill'), db: $('db'), da: $('da') };
function hud() {
  if (!S.got) return;
  const whole = Math.floor(S.mid), frac = (S.mid - whole).toFixed(2).slice(1);
  el.mid.innerHTML = whole.toLocaleString('en-US') + '<small>' + frac + '</small>';
  const bps = S.spread / S.mid * 1e4;
  el.spr.textContent = (bps < 0.1 ? bps.toFixed(4) : bps.toFixed(2)) + ' bps · $' + S.spread.toFixed(2);
  el.dot.className = S.live ? 'live' : 'replay';
  el.feed.textContent = S.live ? 'Live feed' : 'Synthetic replay';
  el.note.textContent = S.live ? 'ws-feed.exchange.coinbase.com' : (S.connecting ? 'connecting to live feed…' : 'live feed unreachable · seeded book');
  el.rtt.textContent = S.live && S.rtt >= 0 ? S.rtt.toFixed(0) + ' ms' : '—';
  el.tps.textContent = Math.round(S.tps).toLocaleString('en-US') + ' ticks/s';
  el.mom.textContent = fmtUSD(S.mom) + '/s ' + (S.momSigned >= 0 ? '▲' : '▼');
  el.fps.textContent = S.fps.toFixed(0) + ' fps';
  const tot = S.d1b + S.d1a || 1, pb = S.d1b / tot * 100;
  el.ib.textContent = pb.toFixed(1) + '%'; el.ia.textContent = (100 - pb).toFixed(1) + '%';
  el.bar.style.width = pb + '%';
  el.db.textContent = fmtUSD(S.d1b) + ' within 1%'; el.da.textContent = fmtUSD(S.d1a) + ' within 1%';
}
setInterval(hud, 100);

const WARP = Math.max(1, Math.min(8, +params.get('warp') || 1));   // ?warp=N is a test aid, not a feature
let last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  const real = (t - last) / 1000; last = t;
  if (real > 0 && real < 1) S.fps += (1 / real - S.fps) * 0.05;
  const dt = clamp(real, 1 / 120, 1 / 30);
  simTime += dt * WARP; bootT += dt * WARP;
  resize();
  if (S.got) for (let i = 0; i < WARP; i++) { updateData(dt); simulate(dt); }
  render();
}
requestAnimationFrame(frame);
</script>
